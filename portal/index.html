<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chefmate</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- Theme -->
  <meta name="theme-color" content="#1a3557">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chefmate">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- Android / General -->
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a3557; }
    iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .catch(function (err) { console.warn('SW registration failed:', err); });
      });
    }
  </script>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/1XJM07ZSGwYfhJMGbs_lQjUZKEO8ymYOXX81RaFFhnhrV0PDckGBPQXQt/exec"
    allowfullscreen="true"
    allow="camera; microphone; geolocation">
  </iframe>
</body>
</html>
